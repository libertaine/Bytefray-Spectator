; Bytefray Spectator export presets (Godot 4.7.2).
;
; Tracked here instead of the project root because the root export_presets.cfg
; is git-ignored (Godot writes signing credentials into it). The build scripts
; in this folder copy this file into place for the duration of an export.
; Platform-specific settings live only in the preset for that platform.
;
; Both presets embed the .pck in the executable, so each build is a single file
; that needs neither the Godot editor, Bytefray nor Python. Only the runtime
; viewer is packaged: the presentation JSON of the bundled fixtures and the cue
; bank are included; documentation, tests, the Python exporter, the showcase
; agents and the raw match sources are not.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="fixtures/showcase/presentation/*.json, fixtures/dev/presentation/*.json, fixtures/production_sample/presentation/*.json, audio/announcer/voice.json, audio/announcer/*.wav"
exclude_filter="docs/*, tests/*, packaging/*"
export_path="build/windows/bytefray-spectator.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="Bytefray Spectator"
application/file_description="Bytefray Spectator - verified match viewer"
application/copyright="Copyright 2026 Rod Satterfield (MIT)"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="fixtures/showcase/presentation/*.json, fixtures/dev/presentation/*.json, fixtures/production_sample/presentation/*.json, audio/announcer/voice.json, audio/announcer/*.wav"
exclude_filter="docs/*, tests/*, packaging/*"
export_path="build/linux/bytefray-spectator.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
